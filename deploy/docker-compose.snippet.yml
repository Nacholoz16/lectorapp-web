# =============================================================================
# Servicio a AÑADIR (bajo `services:`) en /home/ubuntu/[LECTORAPP]/docker-compose.yml.
# Es una plantilla: NO es un compose completo ni se usa directamente.
# Ver DEPLOY.md → "Primera instalación".
# =============================================================================
services:
  web:
    build:
      context: ./web            # el clon de este repo: /home/ubuntu/[LECTORAPP]/web
    image: lectorapp-web:latest
    container_name: lectorWeb
    restart: unless-stopped
    # Sin `ports:`: no se publica en el host. Nginx Proxy Manager lo alcanza por la red
    # de Docker en http://lectorWeb:8080 (debe compartir red con nginx_proxy, igual que
    # lo hacía el antiguo `frontend`/lectorFront; copiar aquí su bloque `networks:` si tenía uno).
    expose:
      - "8080"
    # Endurecimiento: sistema de archivos de solo lectura (Nginx solo escribe en /tmp),
    # sin capacidades de Linux y sin escalar privilegios.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
