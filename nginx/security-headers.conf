# Cabeceras de seguridad comunes a TODAS las respuestas.
#
# Se incluye (include) dentro de cada `location` que define su propio add_header, porque en
# Nginx un add_header dentro de una location ANULA todos los heredados del bloque server.
# `always` hace que también se envíen en respuestas de error (404, 500...).

# CSP: solo recursos del propio sitio. Nada inline (ni <script> ni style=), sin eval,
# sin iframes que nos incrusten y sin plugins. connect-src permite llamar a la API
# (lo usará el panel /admin, tarea 5.3).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' https://api.nacholoz3d.cl; manifest-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

# HSTS: el navegador recuerda durante 1 año que este dominio solo se usa por HTTPS.
# (En Nginx Proxy Manager NO activar "HSTS Enabled": duplicaría la cabecera.)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# El navegador no "adivina" tipos de archivo (evita que un .png se ejecute como script).
add_header X-Content-Type-Options "nosniff" always;

# A otros sitios solo se les dice el dominio de origen, nunca la ruta completa.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# La web no usa cámara, micrófono, ubicación, pagos, etc.: se desactivan explícitamente.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;

# Equivalente antiguo de frame-ancestors 'none' (navegadores viejos).
add_header X-Frame-Options "DENY" always;

# Aísla la ventana de otras pestañas/ventanas abiertas desde otros orígenes.
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Nuestros archivos solo pueden cargarse desde nuestro propio sitio.
add_header Cross-Origin-Resource-Policy "same-origin" always;
