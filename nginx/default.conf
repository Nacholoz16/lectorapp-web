# Servidor de la web estática de LectorApp (contenedor lectorWeb).
#
# Este archivo se carga dentro del bloque `http` del nginx.conf de la imagen
# nginxinc/nginx-unprivileged (corre como usuario sin privilegios, puerto 8080).
# En producción el HTTPS lo pone Nginx Proxy Manager, delante de este contenedor.

# Log de acceso SIN datos personales: ni IP, ni navegador, ni query string.
log_format lectorapp_privacy '[$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

# Caché según el tipo de respuesta: el HTML siempre se revalida (así un deploy se ve al
# instante); el resto de archivos sin hash (favicon, robots.txt) se guarda un día.
map $sent_http_content_type $lectorapp_cache_control {
    default        "public, max-age=86400";
    ~^text/html    "no-cache";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/lectorapp;
    charset utf-8;

    access_log /var/log/nginx/access.log lectorapp_privacy;

    # No anunciar la versión de Nginx.
    server_tokens off;
    # Redirecciones relativas: detrás del proxy no hay que conocer el dominio ni el puerto.
    absolute_redirect off;

    # Cabeceras de seguridad para las respuestas de las location que NO definen add_header
    # propio (redirecciones 301, return 404...). Las que sí lo definen las vuelven a incluir.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Página 404 propia (pre-renderizada) para cualquier ruta inexistente.
    error_page 404 /404.html;

    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Healthcheck de Docker (no se registra en el log).
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Archivos con hash en el nombre (CSS, fuentes, JS): si cambian, cambia el nombre,
    # así que el navegador puede guardarlos un año sin volver a preguntar.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Panel de administración (tarea 5.3): una SPA. Toda ruta /admin/... que no sea un
    # archivo real devuelve /admin/index.html y React decide qué mostrar. Mientras no
    # exista el panel, responde con la 404.
    location = /admin {
        return 301 /admin/;
    }
    location ^~ /admin/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $lectorapp_cache_control always;
        try_files $uri /admin/index.html =404;
    }

    # Archivos ocultos (.git, .env...): nunca. Se permite /.well-known/ (verificaciones).
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # --- Redirecciones a la URL canónica -------------------------------------------------
    # SEGURIDAD (open redirect): $uri llega DECODIFICADO, así que /%5Cevil.com/ sería
    # "/\evil.com/" y un Location "/\evil.com" el navegador lo lee como //evil.com (otro
    # sitio). Por eso las redirecciones solo copian rutas hechas de caracteres seguros
    # ([A-Za-z0-9_-] y "/"), que empiezan por "/" + carácter seguro: nunca "//", "/\",
    # tabuladores ni saltos de línea. Lo que no cumpla el patrón no se redirige → 404.
    # Comprobación automática: scripts/smoke-test.sh.

    # Una sola URL para la portada: /index y /index.html → /.
    location ~ ^/index(\.html)?$ {
        return 301 /;
    }

    # Sin extensión: /terminos.html → /terminos. (La 404 interna no pasa por aquí:
    # `location = /404.html` es coincidencia exacta y tiene prioridad sobre las regex.)
    location ~ "^(?<lectorapp_page>/[A-Za-z0-9_-][A-Za-z0-9/_-]*)\.html$" {
        return 301 $lectorapp_page$is_args$args;
    }

    # Sin barra final: /terminos/ → /terminos.
    location ~ "^(?<lectorapp_path>/[A-Za-z0-9_-][A-Za-z0-9/_-]*?)/+$" {
        return 301 $lectorapp_path$is_args$args;
    }

    # La 404 solo se ve como error, nunca como página normal con estado 200.
    location = /404 {
        return 404;
    }

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $lectorapp_cache_control always;
        try_files /index.html =404;
    }

    # Páginas pre-renderizadas: /terminos → /terminos.html. Si no existe → 404 propia.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $lectorapp_cache_control always;
        try_files $uri $uri.html =404;
    }
}
